name: fujisawa_naika_clinic

services:
  app:
    build:
      context: ./docker/php
    container_name: fn_app
    volumes:
      - ./src:/var/www/html
      - fn_vendor:/var/www/html/vendor
      - fn_view_cache:/var/www/html/storage/framework/views
      - fn_bootstrap_cache:/var/www/html/bootstrap/cache
    working_dir: /var/www/html
    depends_on:
      - db
    networks:
      - fn_network

  web:
    image: nginx:1.27-alpine
    container_name: fn_web
    ports:
      - "${APP_PORT:-8002}:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - fn_network

  db:
    image: mysql:8.0
    container_name: fn_db
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - fn_db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "${DB_PORT:-3308}:3306"
    networks:
      - fn_network

  phpmyadmin:
    image: phpmyadmin:5
    container_name: fn_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USERNAME:-laravel}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${PHPMYADMIN_PORT:-8082}:80"
    depends_on:
      - db
    networks:
      - fn_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: fn_mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1027}:1025"
      - "${MAILPIT_HTTP_PORT:-8027}:8025"
    networks:
      - fn_network

  # Frontend asset build tool (Vite). Only used via
  # `docker compose run --rm --service-ports node <command>`
  # (e.g. npm install / npm run build / npm run dev).
  # src/vite.config.js expects the dev server on host port 5174.
  node:
    image: node:22-alpine
    container_name: fn_node
    working_dir: /app
    volumes:
      - ./src:/app
    ports:
      - "${VITE_PORT:-5174}:5173"
    profiles:
      - tools

networks:
  fn_network:
    driver: bridge

volumes:
  fn_db_data:
  fn_vendor:
  fn_view_cache:
  fn_bootstrap_cache:
